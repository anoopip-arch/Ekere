<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A Year at the Lake</title>
  <link rel="stylesheet" href="year.css?v=18">
</head>
<!-- Shows one lake: year.html?lake=<slug>. Reads data/<slug>.js and frames/<slug>/. -->
<body>
  <div class="wrap">
    <header class="head">
      <div class="title">
        <h1 id="finding">Loading…</h1>
        <div class="eyebrow" id="eyebrow"></div>
      </div>
      <div class="pick">
        <label class="eyebrow" for="season">Year</label>
        <select id="season"></select>
      </div>
    </header>

    <section class="top" aria-label="Selected month">
      <div class="card mapbox">
        <div class="map-head">
          <div class="eyebrow">Lake map</div>
          <div class="view" role="group" aria-label="Map view">
            <button type="button" data-view="photo" aria-pressed="true">Satellite</button>
            <button type="button" data-view="drawing" aria-pressed="false">Drawing</button>
          </div>
        </div>
        <div class="frame" id="frame"></div>
        <p class="frame-note" id="frame-note"></p>
      </div>
      <div class="card readout">
        <div class="controls">
          <button type="button" class="play" id="play">Play</button>
          <input type="range" id="month" min="0" max="11" step="1" value="0" aria-label="Month">
        </div>
        <h2 id="r-month"></h2>
        <div><span class="state" id="r-state"></span></div>
        <dl class="kv" id="r-habitat"></dl>
        <p class="note" id="r-wq"></p>
        <p class="note" id="r-birds"></p>
      </div>
    </section>

    <section class="timeline" aria-label="Year timeline"><div class="tl" id="timeline"></div></section>

    <section class="card">
      <div class="eyebrow" style="margin-bottom:10px">Highlights</div>
      <ul class="events" id="highlights"></ul>
    </section>

    <div class="legend" id="legend"></div>
    <p class="about" id="about"></p>
  </div>
  <script src="year.js?v=18"></script>
</body>
</html>
